# HTTP Proxy Server with Caching - Configuration File
# ----------------------------------------------------

# Network Settings
port = 8080
bind_address = 0.0.0.0
backlog = 128

# Concurrency & Worker Pool
worker_threads = 8
max_queue_size = 100
queue_timeout_ms = 2000
max_concurrent_connections = 250
socket_timeout_seconds = 10

# Traffic Management & Limits
max_request_size_bytes = 2097152    # 2 MB
max_response_size_bytes = 20971520  # 20 MB

# Cache Configuration
cache_enabled = true
cache_policy = LRU                 # LRU or LFU
max_cache_entries = 1000
max_cache_memory_mb = 64
default_ttl_seconds = 60
max_cache_object_size_kb = 4096     # 4 MB max size per object

# Distributed Caching & Cluster
cluster_enabled = false
node_id = node-1
peer_address = 127.0.0.1
peer_port = 8081

# Static Assets Path
static_dir = ../frontend
